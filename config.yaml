# secupick 설정 파일
# 발송 시각과 수집 주기는 .github/workflows/daily.yml 의 cron 에서 바꿉니다.
# 3시간마다 수집해서 쌓아 두고, 매일 아침 한 번에 보냅니다 (개수 제한 없음, 중복 기사는 묶음).

# 새 소식이 하나도 없어도 "오늘은 새 소식 없음" 메일을 보낼지
# (true 로 두면 프로그램이 살아있는지 매일 확인할 수 있어요)
send_when_empty: true

# 기사 제목 아래에 첫 문단(요약)을 보여줄지 (메일·Slack 공통)
# false: 제목·출처·시각만 표시 / true: 첫 문단도 표시
# (CISA KEV 는 기사가 아니라 취약점 설명이라 항상 표시)
show_summary: false

# 글 분류 규칙 (제목과 요약에 아래 단어가 있으면 해당 섹션으로 분류)
# 순서: always_exclude(버림) → vuln(취약점) → incident(침해사고) → policy(정책·법·지침)
#       → 어디에도 안 걸리면 버림 (실적, 일반 기업 소식 등)
# exclude 단어가 제목에 있는 policy 글도 버립니다 (행사·홍보·실적 기사 등).
# 영문은 대소문자 구분 없음. 필요에 따라 자유롭게 추가/삭제하세요.
classify:
  # 제목에 있으면 무조건 버림 (새 소식이 아닌 글). KISA 공지에는 적용 안 함
  always_exclude:
