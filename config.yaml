# 메일 섹션 순서와 이름
sections:
  kev: "🚨 실제 악용 중인 취약점 (CISA KEV)"
  vuln: "🛡️ 새 취약점·보안 업데이트"
  incident: "💥 침해사고·공격"
  policy: "📜 정책·법·지침"

# 수집 소스
# type: rss (기본) 또는 cisa_kev
# stale_days: 피드의 최신 글이 이 일수보다 오래되면 '피드가 멈췄을 수 있음'으로 경고 (기본 3일)
# 문제가 생기면 아침 브리핑 맨 아래에 표시되고, 낮에 연속 3번(약 45분) 문제가 나면 바로 경고 메일이 옵니다.
sources:
  # --- 국내 공지 ---
  - name: KISA 보호나라 보안공지
    category: notice_kr
    default_kind: vuln   # 분류 단어에 안 걸려도 취약점·업데이트로 취급
    stale_days: 14       # 공지는 매일 올라오지 않으므로 14일 넘게 새 글이 없을 때만 경고
    url: https://www.boho.or.kr/kr/rss.do?bbsId=B0000133

  - name: KISA 보호나라 취약점 정보
    category: notice_kr
    default_kind: vuln
    stale_days: 14
    url: https://www.boho.or.kr/kr/rss.do?bbsId=B0000302

  - name: KISA 보안취약점 정보포털 국내 취약점 정보
    category: notice_kr
    default_kind: vuln
    stale_days: 30
    url: https://knvd.krcert.or.kr/rss/security/info

  # --- 국내 뉴스 ---
  - name: 보안뉴스
    category: news_kr
    force_kst: true   # 데일리시큐와 같은 기사 시스템이라 시간 표기 보정
    url: https://www.boannews.com/rss/allArticle.xml

  - name: 데일리시큐
    category: news_kr
    force_kst: true   # 한국 시간을 UTC 로 잘못 표기하는 사이트라 보정
    url: https://www.dailysecu.com/rss/allArticle.xml

  # --- 해외 뉴스 ---
  - name: The Hacker News
    category: news_global
    url: https://feeds.feedburner.com/TheHackersNews

  - name: BleepingComputer
    category: news_global
    url: https://www.bleepingcomputer.com/feed/

  - name: SecurityWeek
    category: news_global
    url: https://www.securityweek.com/feed/

  - name: Krebs on Security
    category: news_global
    stale_days: 21    # 글이 드물게 올라오는 개인 블로그
    url: https://krebsonsecurity.com/feed/

  # --- 해외 공식 취약점 ---
  - name: CISA KEV
    category: kev
    type: cisa_kev
    stale_days: 14
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
