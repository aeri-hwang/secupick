name: secupick daily

on:
  schedule:
    # GitHub cron 은 UTC 기준입니다. 22:00 UTC = 한국 시간 매일 오전 7시.
    # 예) 오전 8시에 받고 싶으면 "0 23 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행(테스트용)도 가능

permissions:
  contents: write         # 보낸 글 기록(state/seen.json)을 저장소에 커밋하기 위해 필요

concurrency:
  group: secupick
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python main.py

      - name: Save sent history
        run: |
          git config user.name "secupick-bot"
          git config user.email "secupick-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F)"
          git push
